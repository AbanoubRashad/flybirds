name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flybirds
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flybirds
      AUTH_SECRET: ci-only-secret-at-least-sixteen-chars
      # Auth.js only trusts the request host in production when told to (Vercel sets this itself).
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Database schema, search indexes and seed
        run: |
          npx prisma db push --skip-generate
          npx prisma generate
          npm run db:search
          npm run db:seed

      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and integration tests
        run: npm test

      - name: Build and start the site
        run: |
          npm run build
          npm start &
          npx --yes wait-on@8 http://localhost:3000 --timeout 120000

      - run: npx playwright install --with-deps chromium
      - name: Browser tests (sandbox checkout, search, reviews, ops)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
